name: Build SilentGate VPN

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  libbox:
    name: Build libbox.aar (Hiddify sing-box core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve core commit
        id: ref
        run: echo "sha=$(git ls-remote https://github.com/hiddify/hiddify-sing-box.git refs/heads/v5 | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore libbox cache
        id: cache
        uses: actions/cache@v4
        with:
          path: libbox-out
          key: libbox-${{ steps.ref.outputs.sha }}-v1

      - name: Clone core with submodules
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch v5 --recurse-submodules --shallow-submodules https://github.com/hiddify/hiddify-sing-box.git core

      - name: Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Setup Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup JDK 17
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build libbox.aar
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          TAGS="with_gvisor,with_quic,with_wireguard,with_awg,with_masque,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0"
          LDFLAGS="-X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid="
          gomobile bind -v -o libbox.aar -target android/arm64,android/arm -androidapi 24 \
            -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false \
            -ldflags "$LDFLAGS" -tags "$TAGS" ./experimental/libbox
          mkdir -p ../libbox-out
          mv libbox.aar ../libbox-out/libbox.aar

      - uses: actions/upload-artifact@v4
        with:
          name: libbox
          path: libbox-out/libbox.aar
          compression-level: 0

  app:
    name: Build APK
    needs: libbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libbox
          path: app/libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check repository access (diagnostics)
        run: |
          for u in \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.24/kotlin-stdlib-1.9.24.pom \
            https://dl.google.com/dl/android/maven2/androidx/core/core-ktx/1.15.0/core-ktx-1.15.0.pom \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/kotlin-gradle-plugin/2.0.21/kotlin-gradle-plugin-2.0.21.pom ; do
            echo "== $u"
            curl -sS -o /dev/null -w "HTTP %{http_code}, %{size_download} bytes\n" -L "$u" || echo "curl failed"
          done

      - name: Build release APK (with retries)
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if gradle :app:assembleRelease --no-daemon --stacktrace --refresh-dependencies; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Build failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: SilentGateVPN-apk
          path: app/build/outputs/apk/release/*.apk
